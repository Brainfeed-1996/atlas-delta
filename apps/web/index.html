<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas Delta</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      header { padding: 24px; border-bottom: 1px solid #334155; }
      main { padding: 24px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      .card { background: #1e293b; border-radius: 14px; padding: 18px; }
      .stale { color: #f59e0b; }
      .fresh { color: #22c55e; }
    </style>
  </head>
  <body>
    <header>
      <h1>Atlas Delta</h1>
      <p>Operational data and decision platform</p>
    </header>
    <main>
      <section class="card">
        <h2>Datasets</h2>
        <p>Total datasets: 2</p>
      </section>
      <section class="card">
        <h2>Freshness snapshot</h2>
        <p class="fresh">Fresh: 1</p>
        <p class="stale">Stale: 1</p>
      </section>
      <section class="card">
        <h2>Tracked assets</h2>
        <ul>
          <li>customer-risk-signals</li>
          <li>vendor-posture-rollup</li>
        </ul>
      </section>
    </main>
  </body>
</html>
